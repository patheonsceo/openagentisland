# Merged into ~/.config/gtk-3.0/settings.ini and ~/.config/gtk-4.0/settings.ini.
# Only these keys are written; anything else already in the file is left alone.
[Settings]
# Traffic lights: all three buttons on the LEFT.
# The trailing colon is the split between left and right sides, so everything
# before it sits left and nothing sits right.
gtk-decoration-layout=close,minimize,maximize:

# macOS-style icon set, installed userspace to ~/.local/share/icons
gtk-icon-theme-name=WhiteSur-dark

# macOS UI font
gtk-font-name=SF Pro Display 11
