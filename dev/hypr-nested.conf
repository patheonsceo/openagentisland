# Nested Hyprland for openagentisland development.
#
# Runs as a Wayland CLIENT of the host compositor, so it appears as an ordinary
# window on the real desktop. dev/nested.sh pins that window to workspace 8.
#
# Everything it reads comes from the shadow XDG tree nested.sh builds inside the
# worktree, so this session cannot see or write the live ~/.config.

# Wildcard (empty name) so it applies whatever the nested output is called
# (WL-1 / WAYLAND-1 vary between sessions). scale 1.0 = no zoom.
monitor = , 1600x900@60, auto, 1.0

$qsConfig = openagentisland
exec-once = qs -c openagentisland

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# Off so screenshots are deterministic and the nested session stays cheap —
# it shares a GPU with the real desktop that is still doing its job.
animations { enabled = false }
decoration {
    blur { enabled = false }
    shadow { enabled = false }
}

input {
    kb_layout = us
    follow_mouse = 1
}

# Escape hatch: the nested session grabs input while focused.
bind = SUPER SHIFT, Q, exit
