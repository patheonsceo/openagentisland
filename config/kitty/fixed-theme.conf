# macOS Graphite — kitty
# Greys carry ordinary text; colour is reserved for signal (errors, git state, success).
# Accents are Apple's dark-mode system colours, desaturated ~15% so they don't glare
# through the 0.88 background opacity.
# Written 2026-08-31. Previous GitHub Dark theme: fixed-theme.conf.bak.*

foreground            #d6d6da
background            #101014
selection_foreground  #f5f5f7
selection_background  #2e3038

cursor                #d6d6da
cursor_text_color     #101014

url_color             #4b96ee

# --- normal ---
color0  #43434d
color1  #e05c56
color2  #45c46a
color3  #dba43c
color4  #4b96ee
color5  #ac6fdd
color6  #55b8d4
color7  #b8b8bf

# --- bright ---
color8  #5c5c67
color9  #ff6f68
color10 #5fd97f
color11 #f0bd5c
color12 #6fb0ff
color13 #c88df0
color14 #6fd4ea
color15 #f0f0f3

# --- header / tab bar ---
# Same background as the window, so the title floats with no chrome box.
tab_bar_background      none
active_tab_foreground   #f0f0f3
active_tab_background   #101014
inactive_tab_foreground #6e6e78
inactive_tab_background #101014
