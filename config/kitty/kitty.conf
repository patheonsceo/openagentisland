# ──────────────────────────────────────────────────────────────
#  kitty — macOS graphite
#  Reworked 2026-08-31. Rollback: kitty.conf.bak.* / fixed-theme.conf.bak.*
# ──────────────────────────────────────────────────────────────

# Theming
# include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf
include ~/.config/kitty/fixed-theme.conf

# ── Font ──────────────────────────────────────────────────────
# Liga SFMono: Apple's SF Mono, nerd-patched. Chosen over 0xProto because at
# each font's clean line-height it fit more rows without clipping descenders.
# All four faces are real, not synthesised.
font_family      family="Liga SFMono Nerd Font" style=Regular
bold_font        family="Liga SFMono Nerd Font" style=Bold
italic_font      family="Liga SFMono Nerd Font" style=Italic
bold_italic_font family="Liga SFMono Nerd Font" style="Bold Italic"
font_size 10.5

# No cell compression. SF Mono's native line box (1.193 em) is already
# tighter than Meslo's 1.262, so density comes from the font, not a squeeze.
# Compressing this clips the tab bar, which kitty sizes from the same metric.

# macOS gamma/contrast pair. Linux defaults to "1.0 0" — the +30% contrast is
# what gives the crisper strokes. Revert to "platform" if it reads too dense.
text_composition_strategy 1.7 30

# ── Glass ─────────────────────────────────────────────────────
# The blur itself comes from Hyprland: hyprland/rules.lua disables blur for
# every window, custom/rules.lua re-enables it for class=kitty.
# Tune live with ctrl+shift+a then m/l; set 1.0 to go opaque on battery.
background_opacity 0.88
dynamic_background_opacity yes

# ── Header ────────────────────────────────────────────────────
# hyprbars draws the titlebar now, so this only appears for real tabs.
# fish's default title gives "~/d/openagentisland" style text.
tab_bar_edge            top
tab_bar_style           separator
tab_separator           "   "
tab_bar_align           center
tab_bar_min_tabs        2
tab_bar_margin_height   12.0 8.0
tab_bar_margin_width    8.0
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Window ────────────────────────────────────────────────────
# Padding (why weird value? consistency with foot)
window_margin_width 21.75
draw_minimal_borders yes
window_border_width 0
# Dim unfocused splits, macOS-style.
inactive_text_alpha 0.85

# ── Cursor ────────────────────────────────────────────────────
cursor_shape beam
cursor_trail 1
cursor_trail_decay 0.1 0.4

# ── Behaviour ─────────────────────────────────────────────────
scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0
mouse_hide_wait 3.0
url_style curly

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# ── Keymaps ───────────────────────────────────────────────────
# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
